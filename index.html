<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiShows • Link Formatter & GDrive Extractor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animated Live Particle Background -->
<canvas id="bgCanvas"></canvas>

<div class="container">
    <header>
        <div class="badge">PRO VERSION 6.0 • FINAL EDITION</div>
        <h1 class="glow-text">MultiShows Automated Link Engine</h1>
        <p>Ultra-Fast Media Link Parser, Codec Extractor & Nested GDrive Inspector</p>
    </header>

    <div class="grid">
        <!-- Input Card -->
        <div class="card animated-card">
            <div class="card-header">
                <span class="card-title"><span class="icon">📝</span> Raw Input Data</span>
                <span class="status-dot"></span>
            </div>
            <textarea id="rawInput" placeholder="Paste raw filenames and links here..."></textarea>
            <div class="btn-group">
                <button class="btn-primary pulse-btn" onclick="processInput()">⚡ FORMAT LINKS</button>
                <button class="btn-danger" onclick="clearAll()">🗑️ CLEAR</button>
            </div>
            <div id="warningBox" class="warning"></div>
        </div>

        <!-- Output Card -->
        <div class="card animated-card">
            <div class="card-header">
                <span class="card-title"><span class="icon">🚀</span> Telegram Formatted Output</span>
            </div>

            <!-- Search and Replace Section -->
            <div class="search-replace-bar">
                <input type="text" id="findInput" placeholder="Find text (e.g. 2160p HEVC)...">
                <input type="text" id="replaceInput" placeholder="Replace with...">
                <button class="btn-action" onclick="applyReplace()">Replace All</button>
            </div>

            <textarea id="output" readonly placeholder="Formatted output will appear here..."></textarea>
            <button class="btn-copy" onclick="copyOutput()">📋 COPY OUTPUT</button>
        </div>
    </div>

    <!-- Compact Google Drive Extractor Section -->
    <div class="card animated-card gdrive-section">
        <div class="card-header">
            <span class="card-title"><span class="icon">📁</span> Google Drive Link Extractor (Compact)</span>
        </div>
        <div class="gdrive-grid">
            <div class="gdrive-input-box">
                <textarea id="gdriveInput" placeholder="Paste GDrive Folder or file URLs..."></textarea>
                <div class="btn-group compact-btn-group">
                    <button class="btn-primary btn-sm" onclick="extractGDriveLinks()">🔍 EXTRACT</button>
                    <button class="btn-action-send btn-sm" onclick="sendToRawInput()">⬆️ SEND TO RAW</button>
                    <button class="btn-danger btn-sm" onclick="clearGDrive()">🗑️ CLEAR</button>
                </div>
            </div>
            <div class="gdrive-output-box">
                <textarea id="gdriveOutput" readonly placeholder="Extracted links appear here..."></textarea>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
