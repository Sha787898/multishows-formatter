<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiShows Link Formatter Advanced</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>MultiShows Automated Link Formatter</h1>

    <div class="grid">
        <div class="card">
            <h2>Raw Input (ফাইল নেম এবং লিঙ্ক পেস্ট করুন)</h2>
            <textarea id="rawInput" placeholder="এখানে কাঁচা লিঙ্ক ও ফাইল নেম পেস্ট করুন..."></textarea>
            <div class="btn-group">
                <button id="formatBtn">FORMAT LINKS</button>
                <button id="clearBtn" class="clear">CLEAR</button>
            </div>
            <div id="warningBox" class="warning"></div>
        </div>

        <div class="card">
            <h2>Telegram Formatted Output</h2>
            <div id="output"></div>
            <button id="copyBtn" class="copy">COPY OUTPUT</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
