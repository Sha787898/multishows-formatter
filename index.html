<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiShows Advanced Link Formatter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>MultiShows Automated Link Formatter</h1>
        <p>Smart Telegram Link Formatting & Codec Parsing Tool</p>
    </header>

    <div class="grid">
        <!-- Input Card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">📝 Raw Input Data</span>
            </div>
            <textarea id="rawInput" placeholder="Raw links and filenames paste karo..."></textarea>
            <div class="btn-group">
                <button class="btn-primary" onclick="processInput()">⚡ FORMAT LINKS</button>
                <button class="btn-danger" onclick="clearAll()">🗑️ CLEAR</button>
            </div>
            <div id="warningBox" class="warning"></div>
        </div>

        <!-- Output Card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">🚀 Telegram Formatted Output</span>
            </div>

            <!-- Search and Replace Section -->
            <div class="search-replace-bar">
                <input type="text" id="findInput" placeholder="Find text...">
                <input type="text" id="replaceInput" placeholder="Replace with...">
                <button class="btn-action" onclick="applyReplace()">Replace All</button>
            </div>

            <div id="output"></div>
            <button class="btn-copy" onclick="copyOutput()">📋 COPY OUTPUT</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
